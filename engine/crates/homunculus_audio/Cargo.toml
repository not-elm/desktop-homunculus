[package]
name = "homunculus_audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No unit tests: skipping the empty test binary saves a full link of the
# Bevy dependency graph in `cargo test --workspace`. Remove when adding tests.
test = false

[dependencies]
bevy = { workspace = true }
bevy_kira_audio = { version = "0.27", default-features = false, features = ["ogg", "mp3", "wav"] }
homunculus_core = { workspace = true }
serde = { workspace = true }
utoipa = { workspace = true, optional = true }

[features]
default = []
openapi = ["dep:utoipa"]

[lints]
workspace = true
